name: Run Tests

# Запуск автотестов при каждом пуше в любую ветку и при pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем код репозитория в runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Ставим зависимости (pytest, requests)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запускаем тесты
      - name: Run tests
        run: pytest tests/ -v
